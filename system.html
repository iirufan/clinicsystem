<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clinic System Access</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        linear-gradient(
            135deg,
            #e0f2fe,
            #f8fafc,
            #ecfdf5
        );
    color:#0f172a;
}

.card{
    width:min(430px,92%);
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:
        0 20px 60px
        rgba(15,23,42,.12);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-circle{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:
        linear-gradient(
            135deg,
            #0284c7,
            #2563eb
        );
    color:white;
}

h1{
    text-align:center;
    font-size:25px;
    margin:18px 0 8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px 15px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#0284c7;
    box-shadow:
        0 0 0 3px
        rgba(2,132,199,.12);
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-size:15px;
    font-weight:700;
    background:
        linear-gradient(
            135deg,
            #0284c7,
            #2563eb
        );
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    font-size:14px;
}

.success{
    display:block;
    background:#ecfdf5;
    color:#166534;
}

.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
}

.note{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <div class="logo-circle">+</div>
    </div>

    <h1>Clinic System Access</h1>

    <div class="subtitle">
        Enter the clinic system password to authorize this device.
        You only need to do this once unless browser storage is cleared.
    </div>

    <label>System Password</label>

    <input
        type="password"
        id="systemPassword"
        placeholder="Enter system password"
        autocomplete="current-password"
    >

    <button
        id="continueBtn"
        onclick="verifySystemPassword()"
    >
        Authorize Device
    </button>

    <div
        id="status"
        class="status"
    ></div>

    <div class="note">
        The actual password is not saved on this device.
    </div>

</div>

<script>

const AUTH_KEY =
    'clinic_system_authorized';

const statusBox =
    document.getElementById('status');

const button =
    document.getElementById('continueBtn');


/*
If already authorized,
go directly to login.
*/
if (
    localStorage.getItem(AUTH_KEY) === 'true'
) {
    window.location.href =
        'login.html';
}


function showStatus(
    message,
    type
) {

    statusBox.textContent =
        message;

    statusBox.className =
        'status ' + type;
}


async function verifySystemPassword() {

    const password =
        document
        .getElementById(
            'systemPassword'
        )
        .value
        .trim();


    if (!password) {

        showStatus(
            'Enter the system password.',
            'error'
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        'Checking...';


    try {

        const response =
            await fetch(
                '/api/verify-system',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Incorrect system password'
            );
        }


        localStorage.setItem(
            AUTH_KEY,
            'true'
        );


        showStatus(
            'Device authorized successfully.',
            'success'
        );


        setTimeout(() => {

            window.location.href =
                'login.html';

        },500);


    } catch(error) {

        showStatus(
            error.message,
            'error'
        );


    } finally {

        button.disabled = false;

        button.textContent =
            'Authorize Device';
    }
}

</script>

</body>
</html>
